<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Triagem Dermatológica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .gradio-container { background-color: #1f2937; border: 1px solid #374151; border-radius: 12px; width: 100%; max-width: 900px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p.desc { font-size: 0.9rem; color: #9ca3af; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .panel { background-color: #111827; border: 1px solid #374151; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .panel-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #9ca3af; }
    .upload-box { border: 2px dashed #4b5563; border-radius: 8px; padding: 30px 10px; text-align: center; cursor: pointer; background-color: #1f2937; }
    .upload-box:hover { border-color: #f97316; }
    input[type="file"] { display: none; }
    .btn-orange { background-color: #f97316; color: white; border: none; border-radius: 6px; padding: 10px 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-orange:hover { background-color: #ea580c; }
    #preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: 6px; display: none; margin-top: 10px; }
    .output-box { background-color: #1f2937; border: 1px solid #374151; border-radius: 6px; padding: 14px; min-height: 100px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  </style>
</head>
<body>

  <div class="gradio-container">
    <h1>Sistema de Triagem Dermatológica</h1>
    <p class="desc">Envie uma imagem de lesão para análise preditiva por Inteligência Artificial.</p>

    <div class="grid">
      <div class="panel">
        <span class="panel-title">Input</span>
        
        <label for="imageInput" class="upload-box">
          <span id="uploadText">Clique para fazer upload ou arraste o arquivo</span>
          <img id="preview" alt="Preview">
        </label>
        <input type="file" id="imageInput" accept="image/*" onchange="handleFile(event)">

        <button class="btn-orange" onclick="processImage()">Submit</button>
      </div>

      <div class="panel">
        <span class="panel-title">Output</span>
        <div class="output-box" id="outputResult">
          Aguardando imagem...
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('preview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          document.getElementById('uploadText').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    }

    function processImage() {
      const output = document.getElementById('outputResult');
      output.innerText = "Processando matriz de imagem...";
      
      // Simulação da chamada
      setTimeout(() => {
        output.innerText = "Resultado: Benigno (Normal)";
      }, 1200);
    }
  </script>

</body>
</html>
